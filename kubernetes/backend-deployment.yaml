apiVersion: apps/v1
kind: Deployment
metadata:
  name: stemai-backend
  namespace: stemai-tutor
  labels:
    app: stemai-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stemai-backend
  template:
    metadata:
      labels:
        app: stemai-backend
    spec:
      containers:
        - name: backend
          image: vikashsharma0707/thumbnailmaker-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: stemai-config
            - secretRef:
                name: stemai-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
