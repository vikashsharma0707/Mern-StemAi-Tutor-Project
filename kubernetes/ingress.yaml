apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stemai-ingress
  namespace: stemai-tutor
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - stemai-tutor.example.com
      secretName: stemai-tls-secret
  rules:
    - host: stemai-tutor.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: stemai-backend-svc
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stemai-frontend-svc
                port:
                  number: 80
---
# Update the host 'stemai-tutor.example.com' to your actual domain
# For local testing without Ingress, use NodePort services instead
