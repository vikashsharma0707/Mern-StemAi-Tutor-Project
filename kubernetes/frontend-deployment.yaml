apiVersion: apps/v1
kind: Deployment
metadata:
  name: stemai-frontend
  namespace: stemai-tutor
  labels:
    app: stemai-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stemai-frontend
  template:
    metadata:
      labels:
        app: stemai-frontend
    spec:
      containers:
        - name: frontend
          image: vikashsharma0707/thumbnailmaker-frontend:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
